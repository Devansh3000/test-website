<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Feedback Registration Form</title>

  <!-- External CSS (Sub Task 2) -->
  <link rel="stylesheet" href="style.css" />

  <!-- Internal CSS (Sub Task 2) -->
  <style>
    .form-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-subtitle {
      text-align: center;
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .success-banner {
      display: none;
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 1.5rem;
      animation: slideDown 0.4s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  <div class="form-card">
    <div class="form-header-icon">🎓</div>
    <h1 class="form-title">Student Feedback Form</h1>
    <p class="form-subtitle">We value your feedback! Please fill out the form below.</p>

    <div class="success-banner" id="successBanner">
      ✅ Your feedback has been submitted successfully! Thank you.
    </div>

    <form id="feedbackForm" novalidate>

      <!-- Student Name -->
      <div class="form-group">
        <label for="studentName">Student Name <span class="required">*</span></label>
        <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" />
        <span class="error-msg" id="nameError"></span>
      </div>

      <!-- Email ID -->
      <div class="form-group">
        <label for="email">Email ID <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="example@domain.com" />
        <span class="error-msg" id="emailError"></span>
      </div>

      <!-- Mobile Number -->
      <div class="form-group">
        <label for="mobile">Mobile Number <span class="required">*</span></label>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" maxlength="10" />
        <span class="error-msg" id="mobileError"></span>
      </div>

      <!-- Department -->
      <div class="form-group">
        <label for="department">Department <span class="required">*</span></label>
        <select id="department" name="department">
          <option value="">-- Select Department --</option>
          <option value="CS">Computer Science</option>
          <option value="IT">Information Technology</option>
          <option value="ECE">Electronics & Communication</option>
          <option value="ME">Mechanical Engineering</option>
          <option value="CE">Civil Engineering</option>
          <option value="EE">Electrical Engineering</option>
        </select>
        <span class="error-msg" id="deptError"></span>
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label>Gender <span class="required">*</span></label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="gender" value="Male" id="genderMale" /> Male
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="Female" id="genderFemale" /> Female
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="Other" id="genderOther" /> Other
          </label>
        </div>
        <span class="error-msg" id="genderError"></span>
      </div>

      <!-- Feedback Comments -->
      <div class="form-group">
        <label for="feedback">Feedback Comments <span class="required">*</span></label>
        <textarea id="feedback" name="feedback" rows="5"
          placeholder="Please share your feedback (minimum 10 words)..."></textarea>
        <span class="error-msg" id="feedbackError"></span>
      </div>

      <!-- Buttons -->
      <div class="btn-group">
        <button type="submit" id="submitBtn" class="btn btn-submit">🚀 Submit Feedback</button>
        <button type="reset" id="resetBtn" class="btn btn-reset" onclick="resetForm()">🔄 Reset</button>
      </div>

    </form>
  </div>
</div>

<!-- JavaScript Validation (Sub Task 3) -->
<script src="script.js"></script>
</body>
</html>
